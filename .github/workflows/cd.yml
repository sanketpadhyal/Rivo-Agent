name: CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Google Services
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > android/app/google-services.json
          else
            cat << 'EOF' > android/app/google-services.json
            {
              "project_info": {
                "project_number": "123456789012",
                "project_id": "rivo-agent-mock",
                "storage_bucket": "rivo-agent-mock.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                    "android_client_info": {
                      "package_name": "com.rivoapp"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [
                    {
                      "current_key": "fake-api-key"
                    }
                  ],
                  "services": {
                    "analytics_service": {
                      "status": 1
                    }
                  }
                }
              ],
              "configuration_version": "1"
            }
            EOF
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android App
        run: |
          cd android
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/**/*.apk
